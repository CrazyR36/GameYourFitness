name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, Lint, Unit- & Screenshot-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # nur fuer den einmaligen Screenshot-Golden-Bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint & detekt
        run: ./gradlew ktlintCheck detekt

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot-Tests (verify, bzw. erstmaliges Aufnehmen der Goldens)
        run: |
          if ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            ./gradlew verifyRoborazziDebug
          else
            echo "Keine Goldens vorhanden – nehme Erstaufnahme auf und committe sie."
            ./gradlew recordRoborazziDebug
            if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/src/test/screenshots
              git commit -m "test: record initial screenshot goldens"
              git push
            fi
          fi

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

  backend-stack:
    name: Supabase-Stack faehrt auf leerer DB hoch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Stack starten (mit Beispiel-Env)
        run: |
          cp backend/.env.example backend/.env
          docker compose -f backend/docker-compose.yml up -d --quiet-pull

      - name: Auf Erreichbarkeit warten (Caddy, GoTrue, PostgREST)
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' backend/.env | cut -d= -f2-)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1 &&
               curl -fsS http://localhost:8000/auth/v1/health >/dev/null 2>&1 &&
               curl -fsS -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" http://localhost:8000/rest/v1/ >/dev/null 2>&1; then
              echo "Stack ist erreichbar."
              exit 0
            fi
            sleep 5
          done
          echo "Stack wurde nicht gesund:"
          docker compose -f backend/docker-compose.yml ps
          docker compose -f backend/docker-compose.yml logs --tail 100
          exit 1

      - name: Stack stoppen
        if: always()
        run: docker compose -f backend/docker-compose.yml down -v

  e2e:
    name: E2E-Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: E2E-Tests auf Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest

      - name: E2E-Berichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
