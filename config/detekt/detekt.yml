# Ergaenzt die detekt-Defaultkonfiguration (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    # Fruehe Rueckgaben als Guard Clauses am Funktionsanfang sind idiomatisch
    # (Vorbedingungen pruefen und sofort abbrechen) — nicht mitzaehlen.
    excludeGuardClauses: true

complexity:
  LongMethod:
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    # Stateless Composables bekommen State + Callbacks als Parameter (CLAUDE.md 5/7);
    # Formulare mit mehreren Feldern haben dadurch idiomatisch viele Parameter.
    ignoreAnnotated:
      - 'Composable'
